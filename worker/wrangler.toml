# Eden Glow Instagram Worker (Cloudflare Workers, Free plan).
# NOT deployed yet. Before `wrangler deploy` (Node 22.12+):
#   1. npx wrangler kv namespace create IG_KV   → paste the id below
#   2. set the [vars] below
#   3. npx wrangler secret put INSTAGRAM_APP_SECRET / TOKEN_KEY / SYNC_BOT_EMAIL / SYNC_BOT_PASSWORD
# Secrets are never written in this file. See src/admin/README.md.
name = "eden-glow-instagram"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[[kv_namespaces]]
binding = "IG_KV"
id =  "8e4b669ad1724712b614e9af3a59c14b"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "eden-glow-media"

# Every 5 minutes. :00/:15/:30/:45 = the incremental check for new posts (96/day). The other slots
# do one step (one Instagram page) of the 6-hourly link refresh or the first import while one is
# running, and otherwise end after two KV reads. Small steps keep every run within the Free plan's
# 10 ms of CPU. One trigger (the Free plan allows 5 per account).
[triggers]
crons = ["*/5 * * * *"]

[vars]
FIREBASE_PROJECT_ID = "eden-glow-studio"
# The public Firebase web API key (same value as VITE_FIREBASE_API_KEY; not a secret).
FIREBASE_API_KEY = ""
INSTAGRAM_APP_ID = ""
# https://eden-glow-instagram.<your-subdomain>.workers.dev/instagram/callback (also in the Meta app)
INSTAGRAM_REDIRECT_URI = ""
# Admin addresses allowed to call the Worker, comma-separated (the Cloudflare Pages domain + local dev).
ADMIN_ORIGINS = "http://localhost:5173"
